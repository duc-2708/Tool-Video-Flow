<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Arms -->
  <line x1="120" y1="120" x2="280" y2="280" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <line x1="280" y1="120" x2="120" y2="280" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <!-- Central Body -->
  <rect x="160" y="160" width="80" height="80" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="4" filter="url(#glow-cyan)"/>
  <!-- Camera Gimbal -->
  <circle cx="200" cy="200" r="22" fill="#1e293b" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="200" cy="200" r="10" fill="#38bdf8"/>
  <!-- Rotor Motors -->
  <circle cx="120" cy="120" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="280" cy="120" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="120" cy="280" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="280" cy="280" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <!-- Rotors (spinning disks) -->
  <g id="prop-1"><ellipse cx="120" cy="120" rx="45" ry="12" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/></g>
  <g id="prop-2"><ellipse cx="280" cy="120" rx="45" ry="12" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/></g>
  <g id="prop-3"><ellipse cx="120" cy="280" rx="45" ry="12" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/></g>
  <g id="prop-4"><ellipse cx="280" cy="280" rx="45" ry="12" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/></g>
  <!-- Navigation LEDs -->
  <circle id="led-front" cx="200" cy="152" r="5" fill="#22c55e"/>
  <circle id="led-back" cx="200" cy="248" r="5" fill="#ef4444"/>
</svg>