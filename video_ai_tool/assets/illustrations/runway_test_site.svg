<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Ground Plane -->
  <rect x="20" y="20" width="360" height="360" rx="30" fill="#0b1329" stroke="#334155" stroke-width="4"/>
  <!-- Runway Perspective -->
  <polygon points="170,80 230,80 310,340 90,340" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Dashed Centerline -->
  <line x1="200" y1="100" x2="200" y2="130" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="160" x2="200" y2="205" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
  <line x1="200" y1="240" x2="200" y2="300" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
  <!-- Threshold Lights -->
  <circle cx="120" cy="330" r="8" fill="#22c55e"/>
  <circle cx="160" cy="330" r="8" fill="#22c55e"/>
  <circle cx="240" cy="330" r="8" fill="#22c55e"/>
  <circle cx="280" cy="330" r="8" fill="#22c55e"/>
  <text x="200" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="#38bdf8">HOA LAC TEST RANGE</text>
</svg>