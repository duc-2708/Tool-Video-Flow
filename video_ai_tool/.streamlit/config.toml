# file: .streamlit/config.toml
[server]
address = "127.0.0.1"
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#FFD400"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#141414"
textColor = "#FFFFFF"
font = "sans serif"
